name: YTJobs Sync

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:
    inputs:
      max_pages:
        description: "How many pages to scrape"
        required: false
        default: "100"

      dry_run:
        description: "Dry run (scrape only, no monday writes)"
        required: false
        default: "false"

      headless:
        description: "Run browser headless"
        required: false
        default: "true"

      open_for_work_only:
        description: "Only sync talent explicitly marked open for work"
        required: false
        default: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run sync
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}

          MAX_PAGES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_pages || '100' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
          HEADLESS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.headless || 'true' }}
          OPEN_FOR_WORK_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.open_for_work_only || 'false' }}

        run: |
          python sync_ytjobs_to_monday.py
